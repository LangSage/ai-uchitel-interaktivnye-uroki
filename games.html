<body>
<main class="app"><div class="deck" id="deck" aria-label="Четыре игры для интерактивного урока">
  <section class="slide mint" data-notes="Начинаем с одного вопроса и постепенно добавляем выбор, действия и сюжет. Здесь четыре короткие игры: расследование, диалог, сортировка и викторина. Откройте любую. Они встроены в этот файл и работают без сети. Во время пяти минут достаточно показать одну или две игры.">
    <p class="eyebrow">Интерактивная часть</p><button class="hub-theme" data-theme-toggle aria-label="Включить тёмную тему">🌙 Тема</button><h2>От упражнения к мини-игре</h2><div class="game-cards"><button class="game-card" data-game="quiz"><span class="icon">🧊</span><b>Вопрос и ответ</b><small>Быстрая викторина с объяснением</small></button><button class="game-card" data-game="dialog"><span class="icon">💬</span><b>Развилка</b><small>Диалог с выбором реплики</small></button><button class="game-card" data-game="sort"><span class="icon">♻️</span><b>Действие</b><small>Сортировка предметов по контейнерам</small></button><button class="game-card" data-game="river"><span class="icon">🕵️</span><b>Сюжет</b><small>Расследование с уликами и выводом</small></button></div><p class="footnote">Выберите игру. Все сценарии работают без интернета.</p>
  </section>

  <div class="progress" id="progress"></div><nav class="nav" aria-label="Навигация по презентации"><button id="prev" title="Предыдущий слайд (←)">← Назад</button><span class="count" id="count">1 / 10</span><button id="next" title="Следующий слайд (→)">Вперёд →</button><span class="spacer"></span><button class="hide-mobile" id="notesBtn" title="Заметки (N)">Заметки</button><button class="hide-mobile" id="fullBtn" title="Полный экран (F)">⛶ Экран</button><button id="gamesBtn">Игры</button><button id="themeBtn" data-theme-toggle title="Переключить тему (T)" aria-label="Включить тёмную тему">🌙 Тема</button></nav><div class="notes-panel" id="notesPanel" aria-live="polite"><h3>Заметки докладчика</h3><p id="notesText"></p></div>
  <section class="overlay" id="gameOverlay" aria-label="Интерактивная игра" aria-hidden="true"><div class="game-head"><h2 id="gameTitle"></h2><button class="button ghost small close" id="closeGame">← К выбору игр</button></div><div class="game-body" id="gameBody"></div></section>
</div></main>
<script>
(()=>{'use strict';
const slides=[...document.querySelectorAll('.slide')],count=document.getElementById('count'),progress=document.getElementById('progress'),notesPanel=document.getElementById('notesPanel'),notesText=document.getElementById('notesText'),overlay=document.getElementById('gameOverlay'),gameTitle=document.getElementById('gameTitle'),gameBody=document.getElementById('gameBody');let index=0,currentGame=null;

document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('gamesBtn').onclick=()=>show(7);document.getElementById('closeGame').onclick=closeGame;document.getElementById('notesBtn').onclick=()=>notesPanel.classList.toggle('open');document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('deck').requestFullscreen?.()};document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>openGame(b.dataset.game)));
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if(e.target.closest('button,a')){if(e.key==='Enter'||e.key===' ')return}if(e.key==='Escape'&&currentGame){closeGame();return}if(currentGame)return;if(e.key==='ArrowRight'||e.key==='PageDown'){show(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){show(index-1)}if(e.key.toLowerCase()==='n')notesPanel.classList.toggle('open');if(e.key.toLowerCase()==='t')applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(e.key.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('deck').requestFullscreen?.()}});

const themeButtons=[...document.querySelectorAll('[data-theme-toggle]')];function applyTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeButtons.forEach(b=>{b.textContent=dark?'☀️ Тема':'🌙 Тема';b.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');b.setAttribute('aria-pressed',dark?'true':'false')});try{localStorage.setItem('ai-teacher-theme',dark?'dark':'light')}catch{}}let savedTheme='light';try{savedTheme=localStorage.getItem('ai-teacher-theme')||'light'}catch{}applyTheme(savedTheme);themeButtons.forEach(b=>b.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')));

 };return art[name]||''}

let riverOpened=new Set(),riverAnswered=false;function river(){gameTitle.textContent='Кто загрязнил реку?';riverOpened=new Set();riverAnswered=false;gameBody.innerHTML=`${sceneArt("river")}<p class="game-intro">После сильного дождя в реке погибла рыба. Откройте три улики и выберите наиболее вероятную версию.</p><div class="clue-grid"><button class="clue" data-clue="0">🏭 Завод <small>Открыть улику</small></button><button class="clue" data-clue="1">🚜 Ферма <small>Открыть улику</small></button><button class="clue" data-clue="2">🚙 Автомойка <small>Открыть улику</small></button></div><div class="choice-grid"><button class="choice" data-river="0">Версия 1: завод</button><button class="choice" data-river="1">Версия 2: ферма</button><button class="choice" data-river="2">Версия 3: автомойка</button></div><div class="feedback" id="feedback" role="status">Сначала изучите улики.</div><div class="game-actions"><button class="button small" id="resetGame">Начать заново</button></div>`;const clues=['В ночь происшествия завод не работал.','Накануне ферма внесла удобрения рядом с рекой.','Автомойка находится ниже по течению от места гибели рыбы.'];gameBody.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.clue);riverOpened.add(i);b.classList.add('opened');b.querySelector('small').textContent=clues[i];feedback(riverOpened.size===3?'Улики открыты. Какая версия лучше объясняет событие?':'Откройте остальные улики.')} );gameBody.querySelectorAll('[data-river]').forEach(b=>b.onclick=()=>{if(riverOpened.size<3){feedback('Откройте все три улики перед выбором.','warn');return}if(riverAnswered)return;riverAnswered=true;const i=Number(b.dataset.river);feedback(i===1?'Версия фермы наиболее вероятна: удобрения могли попасть в реку с дождевой водой. Для вывода нужен анализ воды.':i===0?'Завод не работал в ночь происшествия. Более вероятна ферма, но её роль нужно проверить анализом воды.':'Автомойка расположена ниже по течению. Более вероятна ферма, но её роль нужно проверить анализом воды.',i===1?'good':'warn');gameBody.querySelectorAll('[data-river]').forEach(x=>x.disabled=true)});document.getElementById('resetGame').onclick=river}
const dialogQuestions=[{scene:'Клиент говорит: «Мой заказ задержали, а мне он нужен сегодня».',options:['«Это не моя проблема»','«Понимаю. Проверю статус и скажу, что можем сделать»','«Подождите молча, я занят»'],answer:1,explain:'Сначала признаём проблему и уточняем факты.'},{scene:'Клиент объясняет ситуацию. Что делает сотрудник?',options:['Перебивает и спорит','Выслушивает до конца и уточняет номер заказа','Сразу обещает возврат без проверки'],answer:1,explain:'Уточнение помогает предложить реальное решение.'},{scene:'Проверка показала задержку. Как завершить разговор?',options:['«Ничем помочь не могу»','«Я вам перезвоню когда-нибудь»','«Доставка возможна завтра до 12:00. Подойдёт?»'],answer:2,explain:'Нужны конкретный следующий шаг и согласование с клиентом.'}];let dialogStep=0,dialogScore=0;function dialog(){gameTitle.textContent='Разговор с клиентом';dialogStep=0;dialogScore=0;renderDialog()}function renderDialog(){if(dialogStep===dialogQuestions.length){gameBody.innerHTML=`<p class="lead">Разговор завершён</p><div class="feedback good">Верных ответов: ${dialogScore} из ${dialogQuestions.length}. Главный приём: выслушать, уточнить, предложить конкретное решение.</div><button class="button small" id="again">Сыграть ещё раз</button>`;document.getElementById('again').onclick=dialog;return}const q=dialogQuestions[dialogStep];gameBody.innerHTML=`${sceneArt("dialog")}<p class="question-count">Ситуация ${dialogStep+1} из ${dialogQuestions.length}</p><p class="game-intro">${q.scene}</p><div class="choice-grid">${q.options.map((x,i)=>`<button class="choice" data-dialog="${i}">${x}</button>`).join('')}</div><div class="feedback" id="feedback" role="status">Выберите реплику сотрудника.</div><div class="game-actions"><button class="button small" id="nextDialog" style="display:none">Дальше →</button></div>`;gameBody.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.dialog)===q.answer;if(ok)dialogScore++;feedback(`${ok?'Верно.':'Попробуйте иначе в следующий раз.'} ${q.explain}`,ok?'good':'warn');gameBody.querySelectorAll('[data-dialog]').forEach(x=>x.disabled=true);document.getElementById('nextDialog').style.display='inline-block'});document.getElementById('nextDialog').onclick=()=>{dialogStep++;renderDialog()}}
const sortItems=[['Газета','бумага'],['Тетрадь','бумага'],['Пластиковая бутылка','пластик'],['Пакет','пластик'],['Стеклянная банка','стекло'],['Стеклянная бутылка','стекло']];let selectedSort=null,sortDone=new Set();function sort(){gameTitle.textContent='Сортировка отходов';selectedSort=null;sortDone=new Set();gameBody.innerHTML=`${sceneArt("sort")}<p class="game-intro">Выберите предмет, затем нажмите на подходящий контейнер.</p><div id="sortItems">${sortItems.map(([name],i)=>`<button class="sort-item" data-item="${i}">${name}</button>`).join('')}</div><div class="sort-grid"><button class="sort-bin" data-bin="бумага">📄 Бумага<small>Газеты, тетради</small></button><button class="sort-bin" data-bin="пластик">🧴 Пластик<small>Бутылки, пакеты</small></button><button class="sort-bin" data-bin="стекло">🍶 Стекло<small>Банки, бутылки</small></button></div><div class="feedback" id="feedback" role="status">Выберите первый предмет.</div><button class="button small" id="resetGame">Начать заново</button>`;gameBody.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.item);if(sortDone.has(i))return;selectedSort=i;gameBody.querySelectorAll('[data-item]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');feedback(`Выбран предмет: ${sortItems[i][0]}. Нажмите на контейнер.`)});gameBody.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{if(selectedSort===null){feedback('Сначала выберите предмет.','warn');return}const [name,bin]=sortItems[selectedSort];if(bin===b.dataset.bin){sortDone.add(selectedSort);gameBody.querySelector(`[data-item="${selectedSort}"]`).classList.remove('selected');gameBody.querySelector(`[data-item="${selectedSort}"]`).classList.add('done');selectedSort=null;feedback(sortDone.size===sortItems.length?'Отлично! Все шесть предметов распределены.':'Верно! Выберите следующий предмет.','good')}else feedback(`Пока не подходит. Подумайте, из чего сделан предмет «${name}».`,'warn')});document.getElementById('resetGame').onclick=sort}
const quizQuestions=[{q:'Почему лёд держится на поверхности воды?',a:['Лёд легче воды при том же объёме','Лёд притягивается воздухом','Вода выталкивает только белые предметы'],correct:0,why:'При замерзании вода расширяется, плотность льда становится ниже плотности жидкой воды.'},{q:'Что произойдёт с уровнем воды, когда плавающий лёд растает?',a:['Он резко поднимется','Он почти не изменится','Он упадёт вдвое'],correct:1,why:'Плавающий лёд вытесняет столько воды, сколько весит сам. После таяния он даёт примерно тот же объём.'},{q:'Какой опыт помогает проверить объяснение?',a:['Сравнить лёд и камешек в стакане воды','Посчитать белые предметы в комнате','Закрыть стакан крышкой'],correct:0,why:'Лёд плавает, а более плотный камешек тонет: наблюдение помогает обсудить плотность.'}];let quizStep=0,quizScore=0;function quiz(){gameTitle.textContent='Почему лёд плавает?';quizStep=0;quizScore=0;renderQuiz()}function renderQuiz(){if(quizStep===quizQuestions.length){gameBody.innerHTML=`<p class="lead">Викторина завершена</p><div class="feedback good">Результат: ${quizScore} из ${quizQuestions.length}. Попросите студентов объяснить ответ своими словами.</div><button class="button small" id="again">Пройти ещё раз</button>`;document.getElementById('again').onclick=quiz;return}const q=quizQuestions[quizStep];gameBody.innerHTML=`${sceneArt("quiz")}<p class="question-count">Вопрос ${quizStep+1} из ${quizQuestions.length}</p><p class="game-intro">${q.q}</p><div class="choice-grid">${q.a.map((a,i)=>`<button class="choice" data-quiz="${i}">${a}</button>`).join('')}</div><div class="feedback" id="feedback" role="status">Выберите ответ.</div><button class="button small" id="nextQuiz" style="display:none">Дальше →</button>`;gameBody.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.quiz)===q.correct;if(ok)quizScore++;feedback(`${ok?'Верно.':'Ответ неточный.'} ${q.why}`,ok?'good':'warn');gameBody.querySelectorAll('[data-quiz]').forEach(x=>x.disabled=true);document.getElementById('nextQuiz').style.display='inline-block'});document.getElementById('nextQuiz').onclick=()=>{quizStep++;renderQuiz()}}
function renderGame(){({river,dialog,sort,quiz})[currentGame]?.()}const hash=location.hash.match(/slide-(\d+)/);show(hash?Number(hash[1])-1:0);
})();
